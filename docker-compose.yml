services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-9543}:8443"
      - "127.0.0.1:${GATEWAY_HEALTH_HOST_PORT:-18082}:8080"
    volumes:
      - ./certs/ca:/etc/themisto/ca:ro
      - ./certs/server:/etc/themisto/server:ro
      - ./config:/etc/themisto/config:ro
    environment:
      - CONFIG_PATH=/etc/themisto/config/gateway.yaml
      - DB_DSN=postgres://themisto:${POSTGRES_PASSWORD:-themisto_dev_password}@postgres:5432/themisto?sslmode=disable
      - INTERNAL_TOKEN=${ADMIN_API_KEY:-themisto_dev_admin_key_123}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-}
      - CONTROL_PLANE_TOKEN=${CONTROL_PLANE_TOKEN:-}
      - CONTROL_PLANE_FAIL_MODE=${CONTROL_PLANE_FAIL_MODE:-closed}
      - DLP_BODY_ENCRYPTION_KEY=${ADMIN_API_KEY:-themisto_dev_admin_key_123}
      - PROMPT_SEMANTICS_ENABLED=${PROMPT_SEMANTICS_ENABLED:-false}
      - QWEN_CLASSIFIER_URL=${QWEN_CLASSIFIER_URL:-}
      - QWEN_CLASSIFIER_API_KEY=${QWEN_CLASSIFIER_API_KEY:-}
      - QWEN_CLASSIFIER_TIMEOUT=${QWEN_CLASSIFIER_TIMEOUT:-900ms}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8643}:8443"
    volumes:
      - ./certs/ca:/etc/themisto/ca:ro
      - ./config:/etc/themisto/config:ro
    environment:
      - CONFIG_PATH=/etc/themisto/config/backend.yaml
      - DB_DSN=postgres://themisto:${POSTGRES_PASSWORD:-themisto_dev_password}@postgres:5432/themisto?sslmode=disable
      - ADMIN_API_KEY=${ADMIN_API_KEY:-themisto_dev_admin_key_123}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-}
      - CONTROL_PLANE_TOKEN=${CONTROL_PLANE_TOKEN:-}
      - CONTROL_PLANE_FAIL_MODE=${CONTROL_PLANE_FAIL_MODE:-closed}
      - DLP_BODY_ENCRYPTION_KEY=${ADMIN_API_KEY:-themisto_dev_admin_key_123}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_HOST_PORT:-8643}}
      - PUBLIC_GATEWAY_URL=${PUBLIC_GATEWAY_URL:-https://localhost:${GATEWAY_HOST_PORT:-9543}}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./.codex-tmp/postgres-initdb:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=themisto
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-themisto_dev_password}
      - POSTGRES_DB=themisto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themisto"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_PORT:-3010}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
